name: Otonom Veri Izleme (Bekci)

on:
  schedule:
    - cron: '17 */2 * * *'   # 2 saatte bir
  workflow_dispatch:

concurrency:
  group: otonom-izleme
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  izle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Izle / gerekirse yeniden baslat
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: python .github/scripts/izle.py
