name: Otonom Veri Izleme (Bekci)

on:
  schedule:
    - cron: '*/30 * * * *'   # 30 dakikada bir (kota dostu: ~1440 calisma/ay)
  workflow_dispatch:        # Manuel / cevrimici izleme

concurrency:
  group: otonom-izleme
  cancel-in-progress: false

permissions:
  contents: read
  actions: write            # Basarisiz/duraklamissa ana ajani yeniden tetiklemek icin

jobs:
  izle:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Kopyala
        uses: actions/checkout@v4

      - name: Izle ve Gerekiyorsa Yenden Baslat
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: python .github/scripts/izle.py
