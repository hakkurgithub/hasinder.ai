name: Otonom Veri Izleme (Bekci)

on:
  schedule:
    - cron: '*/5 * * * *'   # GitHub Actions'in en sik araligi (5 dakika)
  workflow_dispatch:        # Manuel / cevrimici izleme

permissions:
  contents: read
  actions: write            # Basarisiz/duraklamissa ana ajani yeniden tetiklemek icin

jobs:
  izle:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Kopyala
        uses: actions/checkout@v4

      - name: Izle ve Gerekiyorsa Yenden Baslat
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: python .github/scripts/izle.py
