name: LLM Proxy Yayini (Cloudflare Worker)

# Opsiyonel: CLOUDFLARE_API_TOKEN ve CLOUDFLARE_ACCOUNT_ID secret'lari tanimliysa calisir.
# LLM anahtarlari (GROQ_API_KEY vb.) Cloudflare panelinde Worker Secret olarak durur.
on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Wrangler deploy
        if: env.CF_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-worker
      - name: Token yok
        if: env.CF_TOKEN == ''
        run: echo "CLOUDFLARE_API_TOKEN tanimli degil; Worker panelden yayinlanmali. Atlaniyor."
