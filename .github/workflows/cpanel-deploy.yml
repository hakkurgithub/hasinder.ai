name: Frontend Yayini (cPanel + CDN)

# Yalniz frontend dosyalari degistiginde calisir. cPanel'e SADECE
# index.html, style.css, app.js, widget.js, widget-ornek.html, .htaccess gider.
# Veri, .git, .py, .pyc ASLA gitmez.
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'style.css'
      - 'app.js'
      - 'widget.js'
      - 'widget-ornek.html'
      - 'deploy/cpanel.htaccess'
  workflow_dispatch:

concurrency:
  group: frontend-yayin
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  yayinla:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Sadece frontend paketini hazirla
        run: |
          mkdir -p _cpanel
          cp index.html style.css app.js widget.js widget-ornek.html _cpanel/
          cp deploy/cpanel.htaccess _cpanel/.htaccess
          ls -la _cpanel

      - name: cPanel'e FTP ile yukle (secret yoksa atlanir)
        if: env.FTP_SERVER != '' && env.FTP_USERNAME != '' && env.FTP_PASSWORD != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./_cpanel/
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}

      - name: jsDelivr onbellegini temizle (harici sitelerdeki widget icin)
        run: |
          for f in app.js widget.js; do
            curl -fsS "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/$f" > /dev/null && echo "purge: $f" || echo "purge atlandi: $f"
          done
