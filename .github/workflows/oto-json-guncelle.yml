name: Otonom Veri Guncelleme Ajani

on:
  schedule:
    - cron: '0 0 * * *'     # Gunde 1 kez (00:00 UTC = 03:00 TR)
  workflow_dispatch:

concurrency:
  group: otonom-veri
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Depoyu kopyala
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Bagimliliklar
        run: pip install --quiet -r backend/requirements.txt

      - name: Scraper (hasinder.com icra kurullari)
        run: python backend/scraper.py

      - name: Veri toplayici (Dunya Bankasi / doviz)
        run: python backend/veri-toplayici.py

      - name: Manifest guncelle
        run: python backend/manifest-olustur.py

      - name: Guvenlik suzgeci (ihlalde commit ENGELLENIR)
        run: python backend/otonom-ajan.py

      - name: Commit & push
        run: |
          git config user.name "hasinder-ai-bot"
          git config user.email "hasinder-ai-bot@users.noreply.github.com"
          git add hasinder-ai-data/
          if git diff --staged --quiet; then
            echo "Yeni veri yok."
            exit 0
          fi
          git commit -m "Otonom Veri Guncellemesi [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 10))
          done
          echo "Push basarisiz" && exit 1
