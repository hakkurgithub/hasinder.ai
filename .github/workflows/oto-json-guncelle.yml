name: Otonom Gunvenlik Suzgeci (JSON Guncelle)

on:
  push:
    branches:
      - main
    paths:
      - 'hasinder-ai-data/*.json'
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  suzgec:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Python Ortamini Dogrula
        run: python --version

      - name: Gunvenlik Suzgecini Calistir
        run: python otonom-ajan.py
        # Suzgec güvensiz/bozuk JSON bulursa exit(1) ile adimi hata verir
        # ve asagidaki commit adimi calismaz.

      - name: Temiz Degisiklikleri GitHub'a Kaydet
        if: ${{ success() }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 hasinder.ai: Otonom gunvenlik suzgeci calisti, temiz veriler guncellendi."
          file_pattern: 'hasinder-ai-data/*.json'
