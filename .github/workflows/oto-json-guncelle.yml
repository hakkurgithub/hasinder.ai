name: Otonom Veri Guncelleme Ajani

on:
  schedule:
    - cron: '0 0 * * *'   # Gunde 1 kez - kota dostu (00:00 UTC = 03:00 Turkiye saati)
  workflow_dispatch:      # GitHub panelinden "Run workflow" ile aninda manuel test edilebilir

concurrency:
  group: otonom-veri
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # Repoya yazma/commit atma izni

    steps:
      - name: Depoyu Kopyala (Checkout)
        uses: actions/checkout@v4

      - name: Python Ortamini Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Gerekli Kutukphaneleri Yukle
        run: pip install --quiet requests beautifulsoup4

      - name: Scraper Ajanini Calistir (hasinder.com icra kurullari)
        run: python scraper.py
        # hasinder.com/kurullar.php sayfasindaki icra kurullari / komisyon / yonetim
        # bilgilerini tarar; script ve zararli icerikleri ayiklar; icra-kurullari.json'a yazar.

      - name: Veri Toplayici Ajanini Calistir (dis ticaret / ekonomi)
        run: python veri-toplayici.py
        # Acik JSON portallarindan (Dunya Bankasi, doviz API) Turkeye ait
        # dis ticaret/ekonomi istatistiklerini ceker; otonom-veri.json'a yazar.

      - name: Guvenlik Suzgeci (zararli veri / sema denetimi)
        run: python otonom-ajan.py
        # Tum hasinder-ai-data/*.json dosyalarini tarar; HTML/script/enjeksiyon iceren
        # veya {soru,cevap} semasına uymayan veri bulursa exit(1) yapar.
        # Boylece asagidaki commit/push adimi calismaz ve zararli veri repoya girmez.

      - name: Degisiklikleri GitHub Reposuna Otomatik Kaydet (Commit & Push)
        run: |
          git config --global user.name "hasinder-ai-bot"
          git config --global user.email "bot@hasinder.ai"
          git add hasinder-ai-data/
          git status
          # Yeni veri varsa commit atar, yoksa sessizce gecer
          git diff --staged --quiet || (git commit -m "Otonom Veri Guncellemesi: Yeni Icra, Kurul ve Ekonomi Bilgileri [skip ci]" && git push)